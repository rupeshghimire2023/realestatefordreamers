[build]
  # Generates environment.ts from Netlify's environment variables, then builds Angular
  command = "npm run build:netlify"
  publish = "dist/real-estate-dreamers/browser"

# Secret scanning is on: a build fails if a secret ends up in the site files.
# In Netlify, mark CHAT_API_KEY and GOOGLE_SCRIPT_URL as "Contains secret values".
# The Firebase config is public by design (it ships to the browser). If smart
# detection flags it, list those values in a
# SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES variable in the Netlify UI rather
# than turning scanning off.

# Functions (chat, lead) set their own URL paths and rate limits in code.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200